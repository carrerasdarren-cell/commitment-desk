<text x="914" y="1129" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#4a606b">A local download for a person to use.</text>
<text x="914" y="1159" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#4a606b">No email or messages are sent.</text>
<text x="60" y="1243" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#4a606b">Exact evidence matching is a constraint, not a guarantee of semantic accuracy. The current demo uses synthetic data.</text>
