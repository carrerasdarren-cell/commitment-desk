<text x="84" y="1129" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#4a606b">Accepted event history stays attached to the item.</text>
<text x="84" y="1159" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#4a606b">Unknown details and conflicts remain visible.</text>
