<text x="60" y="121.24" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#182d39">Evidence before the next follow-up.</text>
<text x="60" y="166.5" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#4a606b">Strands interprets the updates. Application rules reconcile them. A person approves the handoff.</text>
