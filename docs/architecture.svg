<text x="84" y="291.92" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#127567">01 / INPUT</text>
<text x="84" y="328.38" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#182d39">Dated project updates</text>
<text x="84" y="363.68" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#4a606b">Source ID, date and body</text>
<text x="84" y="393.68" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#4a606b">Review date chosen by user</text>
<rect x="560" y="255" width="430" height="170" rx="20" fill="#ffffff" stroke="#d6dddc" stroke-width="2"/>
<text x="584" y="291.92" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#127567">02 / AGENT</text>
<text x="584" y="328.38" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#182d39">Strands agent</text>
<text x="584" y="363.68" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#4a606b">read_updates → structured output</text>
<text x="584" y="393.68" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#4a606b">Real tool callbacks → activity view</text>
<rect x="1080" y="255" width="400" height="170" rx="20" fill="#ffffff" stroke="#d6dddc" stroke-width="2"/>
<text x="1104" y="291.92" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#127567">MODEL PROVIDER</text>
<text x="1104" y="328.38" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#182d39">Amazon Bedrock</text>
<text x="1104" y="363.68" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#4a606b">Nova Lite 1.0 · us-east-2</text>
<text x="1104" y="393.68" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#4a606b">Scoped identity · fetch transport</text>
<rect x="1080" y="490" width="400" height="178" rx="20" fill="#ffffff" stroke="#d6dddc" stroke-width="2"/>
<text x="1104" y="526.92" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#127567">03 / VALIDATION</text>
<text x="1104" y="563.38" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#182d39">Source-specific schema</text>
<text x="1104" y="598.68" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#4a606b">Exact quotes, owners and dates</text>
<text x="1104" y="628.68" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#4a606b">Bounded correction feedback</text>
<rect x="560" y="490" width="430" height="178" rx="20" fill="#ffffff" stroke="#d6dddc" stroke-width="2"/>
<text x="584" y="526.92" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#127567">04 / APPLICATION RULES</text>
<text x="584" y="563.38" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#182d39">Chronological reconciliation</text>
<text x="584" y="598.68" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#4a606b">Completion, withdrawals, conflicts</text>
<text x="584" y="628.68" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#4a606b">Overdue / blocked / unclear / next</text>
<rect x="60" y="775" width="620" height="178" rx="20" fill="#ffffff" stroke="#d6dddc" stroke-width="2"/>
<text x="84" y="811.92" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#127567">05 / HUMAN REVIEW</text>
<text x="84" y="848.38" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#182d39">Inspect evidence and edit the draft</text>
<text x="84" y="883.68" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#4a606b">Accepted event history stays attached to the item.</text>
<text x="84" y="913.68" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#4a606b">Unknown details and conflicts remain visible.</text>
<rect x="890" y="775" width="590" height="178" rx="20" fill="#e9f2ef" stroke="#d6dddc" stroke-width="2"/>
<text x="914" y="811.92" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#127567">06 / HANDOFF</text>
<text x="914" y="848.38" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#182d39">Approve and export Markdown</text>
<text x="914" y="883.68" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#4a606b">A local download for a person to use.</text>
<text x="914" y="913.68" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#4a606b">No email or messages are sent.</text>
<text x="60" y="1004.74" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#4a606b">Exact evidence matching is a constraint, not a guarantee of semantic accuracy. The current demo uses synthetic data.</text>
